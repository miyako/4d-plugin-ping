name: Ownership

on:
  push:
    branches: [master, miyako-ping-ownership-audit]
    paths:
      - '4D Plugin API/**'
      - '4DPlugin.cpp'
      - '4DPlugin.h'
      - 'manifest.json'
      - 'Ping.vcxproj'
      - 'Ping.xcodeproj/project.pbxproj'
      - '.github/tests/ownership*'
      - '.github/tests/test_ownership.py'
      - '.github/workflows/ownership.yml'

permissions:
  contents: read

jobs:
  offline-ownership:
    name: Offline ownership (ASan + UBSan)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual sources and complete SDK; run synthetic host only
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/tests/test_ownership.py -v
